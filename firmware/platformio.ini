; PlatformIO project for ESP32 WROOM-32 + PN532 RFID → HTTP bridge

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  tzapu/WiFiManager@^2.0.17
  adafruit/Adafruit PN532@^1.3.4
  bblanchon/ArduinoJson@^7.2.1
build_flags =
  -DCORE_DEBUG_LEVEL=0
