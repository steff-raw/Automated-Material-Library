; PlatformIO project for ESP32 + PN532 RFID → HTTP bridge
; Default: ESP32-S3 DevKitC-1 (dual USB-C board). Use -e esp32dev for classic WROOM-32.

[platformio]
default_envs = esp32s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
  tzapu/WiFiManager@^2.0.17
  adafruit/Adafruit PN532@^1.3.4
  bblanchon/ArduinoJson@^7.2.1
build_flags =
  -DCORE_DEBUG_LEVEL=0

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32dev]
board = esp32dev
